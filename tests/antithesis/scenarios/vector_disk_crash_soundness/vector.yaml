data_dir: /var/lib/vector

sources:
  in:
    type: http_server
    address: 0.0.0.0:8080
    decoding:
      codec: json
    # No e2e acks: this scenario judges disk_v2 soundness under crashes, not ack
    # durability. With acks disabled a 200 means only "the pipeline took the
    # event", so data loss across a crash is expected and never asserted on here.
    # (Ack durability across a disk-buffer crash is a separate, already-tracked
    # property -- see vector_to_vector_e2e_disk.)
    acknowledgements:
      enabled: false

  metrics:
    type: internal_metrics
    scrape_interval_secs: 1

sinks:
  out:
    type: http
    inputs: [in]
    uri: http://oracle:8686/ingest
    method: post
    encoding:
      codec: json
    # Each event maps to one disk record, so the driver's oversized-payload class
    # exercises the oversized-record drop path deterministically instead of
    # depending on incidental batching.
    batch:
      max_events: 1
    buffer:
      type: disk
      max_size: 8388608 # 8MiB (4 data files), small enough that a stalled reader fills it and blocks
      when_full: block
    acknowledgements:
      enabled: false
    # Tuned for Antithesis fault testing. Vector's default 60s request timeout means a send stuck
    # on a connection broken by a network partition is not abandoned -- and so not retried against
    # the healed network -- for up to 60s. A short request timeout plus a short (but non-zero)
    # retry backoff keeps delivery making progress after faults clear within a few seconds.
    request:
      timeout_secs: 5
      retry_max_duration_secs: 1

  prom:
    type: prometheus_exporter
    inputs: [metrics]
    address: 0.0.0.0:9598
